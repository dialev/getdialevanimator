<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>ใส่หัวข้อของคุณที่นี่</title>
    <meta name="title" content="ใส่หัวข้อของคุณที่นี่">
    <meta name="description" content="ใส่คำอธิบายเนื้อหาหรือรายละเอียดตรงนี้">

    <!-- Open Graph / Discord / Facebook Embed -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourwebsite.com/">
    <meta property="og:title" content="ใส่หัวข้อของคุณที่นี่">
    <meta property="og:description" content="ใส่คำอธิบายเนื้อหาหรือรายละเอียดตรงนี้">
    <meta property="og:image" content="https://via.placeholder.com/1200x630.png?text=Your+Image+Here">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Discord Theme Color (แถบสีแนวตั้งข้างกล่อง Embed) -->
    <meta name="theme-color" content="#7289DA">

    <!-- Twitter Card Embed -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://yourwebsite.com/">
    <meta property="twitter:title" content="ใส่หัวข้อของคุณที่นี่">
    <meta property="twitter:description" content="ใส่คำอธิบายเนื้อหาหรือรายละเอียดตรงนี้">
    <meta property="twitter:image" content="https://via.placeholder.com/1200x630.png?text=Your+Image+Here">

    <!-- Redirect ไปยังลิงก์ is.gd ทันทีด้วย HTML Meta Refresh -->
    <meta http-equiv="refresh" content="0; url=https://is.gd">

    <!-- Redirect สำรองด้วย JavaScript -->
    <script type="text/javascript">
        window.location.href = "https://is.gd";
    </script>
</head>
<body>
    <p>กำลังนำคุณไปยังหน้าปลายทาง... หากระบบไม่ย้ายหน้าอัตโนมัติ <a href="https://is.gd/YOUR_LINK_HERE">คลิกที่นี่</a></p>
</body>
</html>
